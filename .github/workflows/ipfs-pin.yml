name: Build and Pin to IPFS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_pin:
    runs-on: ubuntu-latest
    name: Build and Pin to IPFS
    steps:
      - uses: actions/checkout@v4

      # no `version:` here on purpose - the pnpm version comes from the
      # packageManager field in package.json. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build mainnet
        env:
          PUBLIC_RPC_URL: ${{ vars.PUBLIC_RPC_URL }}

      # Pinned on our OWN node (pinnace), not a paid pinning service.
      #
      # It deploys to the STAGING id, never to `mandalas.eth`. A site wrapper on
      # the node means "the cid this name resolves to", and in ipfs mode that cid
      # only changes when a human moves the ENS contenthash. So CI writing the
      # live id would make the node warm a build nobody resolves, report the live
      # site as permanently stale, and leave the cid ENS actually points at
      # untracked. Staging keeps both facts true at once: newest build here,
      # what the world resolves there.
      #
      # Promotion is the manual step, run when the build has been looked at.
      # `promote-to` is what makes the job summary print it as a ready command
      # (with this build's cid) next to the ENS hash to set, so neither has to be
      # remembered. The previous build stays pinned meanwhile, so nothing goes
      # dark between the two.
      #
      # Only on a real push: a PR build has no business moving even the staging
      # pointer. PRs still build above, which is what they are checked for.
      - name: Deploy to IPFS (staging)
        id: deploy
        if: github.event_name != 'pull_request'
        uses: wighawag/pinnace/actions/deploy@main
        with:
          endpoint: https://ipfs-publisher.ska.sh
          site: mandalas-staging
          mode: ipfs
          dir: web/build
          promote-to: mandalas.eth
        env:
          PINNACE_HOST_PUBLISHER_TOKEN: ${{ secrets.PINNACE_HOST_PUBLISHER_TOKEN }}
