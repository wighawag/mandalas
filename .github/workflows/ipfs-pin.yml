name: Build and Pin to IPFS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_pin:
    runs-on: ubuntu-latest
    name: Build and Pin to IPFS
    steps:
      - uses: actions/checkout@v4

      # no `version:` here on purpose - the pnpm version comes from the
      # packageManager field in package.json. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build mainnet
        env:
          PUBLIC_RPC_URL: ${{ vars.PUBLIC_RPC_URL }}

      # Pinned on our OWN node (pinnace), not a paid pinning service. Generated
      # by `pnpm pinnace install-ci --system github --emit steps --endpoint
      # https://ipfs-publisher.ska.sh --site mandalas.eth --output-dir web/build
      # --set-mode ipfs`.
      #
      # Only on a real push: this step writes /sites/mandalas.eth on the node, so
      # letting a PR build run it would leave the live site's wrapper pointing at
      # that PR (the node would warm and serve a branch). PRs still build above,
      # which is what we want them checked for.
      #
      # `mode: ipfs` means every deploy has its OWN address, so the ENS
      # contenthash is a deliberate, manual step: take the `ipfs://<cid>` the job
      # summary prints and set it on mandalas.eth. The previous build stays
      # pinned until it is explicitly removed, so nothing goes dark in between.
      - name: Deploy to IPFS
        id: deploy
        if: github.event_name != 'pull_request'
        uses: wighawag/pinnace/actions/deploy@main
        with:
          endpoint: https://ipfs-publisher.ska.sh
          site: mandalas.eth
          mode: ipfs
          dir: web/build
        env:
          PINNACE_HOST_PUBLISHER_TOKEN: ${{ secrets.PINNACE_HOST_PUBLISHER_TOKEN }}
