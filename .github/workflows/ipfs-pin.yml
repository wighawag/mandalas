name: Build and Pin to IPFS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_pin:
    runs-on: ubuntu-latest
    name: Build and Pin to IPFS
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build mainnet
        env:
          PUBLIC_RPC_URL: ${{ vars.PUBLIC_RPC_URL }}

      # - name: Pin to IPFS via Filebase
      #   run: pnpm pin
      #   env:
      #     FILEBASE_ACCESS_TOKEN: ${{ secrets.FILEBASE_ACCESS_TOKEN }}
      #     FILEBASE_IPNS_KEY: ${{ vars.FILEBASE_IPNS_KEY }}

      - name: IPFS publishing, pinning and IPNS update
        id: pinata
        uses: ./.github/actions/pinata-upload
        with:
          pinata-jwt: ${{ secrets.PINATA_JWT }}
          build-location: "./web/build"
          pin-alias: "mandalas-${{ github.event_name == 'pull_request' && format('pull_request_{0}', github.head_ref) || 'main' }}"
          cid-version: "1"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ipns-name: ${{ vars.FILEBASE_NAME_LABEL }}
          filebase-access-key: ${{ secrets.FILEBASE_ROOT_ACCESS_KEY }}
          filebase-secret-key: ${{ secrets.FILEBASE_ROOT_SECRET_KEY }}
